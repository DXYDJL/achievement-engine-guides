name: Publish validated guide
on:
  workflow_run:
    workflows: ['Validate guide submission']
    types: [completed]
  workflow_dispatch:
    inputs:
      submissionId:
        description: '需重试发布的投稿 ID'
        required: true
        type: string
permissions:
  actions: read
  contents: write
  pull-requests: read
jobs:
  publish:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'pull_request') }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Revalidate asset and publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          GH_SHA: ${{ github.sha }}
          GH_BEFORE: ${{ github.event.before }}
          SUBMISSION_ID: ${{ inputs.submissionId }}
          WORKFLOW_RUN_ID: ${{ github.event.workflow_run.id }}
          APP_VERSION: ${{ vars.GUIDE_APP_VERSION }}
        run: node scripts/publish-submission.mjs

