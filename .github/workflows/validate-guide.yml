name: Validate guide submission
on:
  pull_request:
    paths:
      - 'submissions/*.json'
permissions:
  contents: write
  pull-requests: write
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      # The validator always comes from the protected base commit. A submitted
      # branch can change metadata, but cannot replace code that runs in CI.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate PR metadata
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/validate-submission.mjs
      - name: Merge validated submission
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          gh api --method PUT "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/merge" \
            -f sha="${PR_HEAD_SHA}" -f merge_method=squash | jq -e '.merged == true'

